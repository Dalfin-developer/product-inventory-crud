<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container my-5 mt-5">
        <h1 class="text-center text-dark mb-5">PRODUCT INVENTORY CRUD OPERATION</h1>
        <form class="row" id="productsForm"> 
        <input type="hidden" id="editStatus" >
        <div class="row">
            <div class="col-lg-3"><input id="productID" type="text" placeholder="Product ID" class="form-control"></div>
            <div class="col-lg-3"><input id="productName" type="text"  placeholder="product name" class="form-control"></div>
            <div class="col-lg-3">
                <select id="SelectCategory" type="text"  class="form-control">
                <option value="" disabled selected>Select Category</option>
                 <option value="Dress">Dress</option>
                 <option value="Electronics">Electronics</option>
                 <option value="grocery">grocery</option>
                 <option value="Cosmetics">Cosmetics</option>
                </select></div>
            <div class="col-lg-3 "><input id="price" type="text" placeholder="price" class="form-control"></div>
            <div class="col-lg-3 mt-5"><input id="Quantity" type="number" placeholder="Quantity" class="form-control"></div>
            <div class="col-lg-3 mt-5"><button id="addProduct" type="submit" class="btn btn-success w-100">Add Product</button></div>
        </div>
        <div class="row mt-5">
            <div class="col-lg-6"><input id="searchProduct" type="text" placeholder="Search Product Name" class="form-control"></div>
            <div class="col-lg-6"><input id="filtterCategory" type="text" placeholder="Filtter Product On Category" class="form-control"></div>
        </div>

        </form>
        <table class="my-5 table table-bordered table-hover">
            <thead class="table-dark text-light my-5 text-center">
                <th>#</th>
                <th>Product Id</th>
                <th>Product Name</th>
                <th>Select category</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Add Product</th>
            </thead>
             <tbody id="tableBody"><!--<tr>
                <td>56</td>
                <td>Jeans</td>
                <td>Dress</td>
                <td>1000</td>
                <td>2</td>
                <td><button class="btn btn-warning">Edit</button>
                <button class="btn btn-danger">Delete</button></td>
                </tr> -->
            </tbody>
        </table>
        
    </div>
<script src="./main.js"></script>
</body>

</html>
