<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
</head>
<body class="bg-light text-dark">

    <div class="container py-5">
        
        <div class="text-center mb-5">
            <h1 class="fw-bold text-primary display-6">
                <i class="bi bi-box-seam me-2"></i>Product Inventory Management
            </h1>
            <p class="text-muted">Manage your product catalog, prices, and stock effortlessly.</p>
        </div>

        <!-- Main Form Card -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4">
                <h5 class="card-title fw-semibold mb-4 text-secondary">
                    <i class="bi bi-pencil-square me-2"></i>Product Details
                </h5>

                <form id="productsForm" autocomplete="off">
                    <input type="hidden" id="editStatus">

                    <div class="row g-3">
                        <!-- Product ID -->
                        <div class="col-md-6 col-lg-4">
                            <label for="productID" class="form-label fw-medium">Product ID</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary"><i class="bi bi-hash"></i></span>
                                <input id="productID" type="text" placeholder="e.g. PRD-101" class="form-control" required>
                            </div>
                        </div>

                        <!-- Product Name -->
                        <div class="col-md-6 col-lg-4">
                            <label for="productName" class="form-label fw-medium">Product Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary"><i class="bi bi-tag"></i></span>
                                <input id="productName" type="text" placeholder="e.g. Wireless Headphones" class="form-control" required>
                            </div>
                        </div>

                        <!-- Category -->
                        <div class="col-md-6 col-lg-4">
                            <label for="SelectCategory" class="form-label fw-medium">Category</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary"><i class="bi bi-grid"></i></span>
                                <select id="SelectCategory" class="form-select" required>
                                    <option value="" disabled selected>Select Category</option>
                                    <option value="Dress">Dress</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Grocery">Grocery</option>
                                    <option value="Cosmetics">Cosmetics</option>
                                </select>
                            </div>
                        </div>

                        <!-- Price -->
                        <div class="col-md-6 col-lg-4">
                            <label for="price" class="form-label fw-medium">Price (₹)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary"><i class="bi bi-currency-rupee"></i></span>
                                <input id="price" type="number" step="0.01" placeholder="0.00" class="form-control" required>
                            </div>
                        </div>

                        <!-- Quantity -->
                        <div class="col-md-6 col-lg-4">
                            <label for="Quantity" class="form-label fw-medium">Quantity</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary"><i class="bi bi-stack"></i></span>
                                <input id="Quantity" type="number" min="0" placeholder="0" class="form-control" required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="col-md-6 col-lg-4 d-flex align-items-end">
                            <button id="addProduct" type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-plus-circle me-1"></i> Add Product
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search & Filter Card -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-3">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input id="searchProduct" type="text" placeholder="Search by product name..." class="form-control border-start-0">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-funnel"></i></span>
                            <select id="filtterCategory" class="form-select border-start-0">
                                <option value="">All Categories</option>
                                <option value="Dress">Dress</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Grocery">Grocery</option>
                                <option value="Cosmetics">Cosmetics</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Table Card -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">#</th>
                            <th>Product ID</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Sample row -->
                        <!-- <tr>
                            <td class="ps-4 fw-bold text-muted">1</td>
                            <td><span class="font-monospace fw-bold">PRD-101</span></td>
                            <td class="fw-medium">Denim Jeans</td>
                            <td><span class="badge bg-info-subtle text-info border border-info-subtle rounded-pill px-3">Dress</span></td>
                            <td class="fw-semibold">₹1,000.00</td>
                            <td><span class="badge bg-secondary rounded-pill">2</span></td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-warning me-1">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </td>
                        </tr> -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
